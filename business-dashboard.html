<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Business Dashboard — Marketly</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap");

    :root {
      --blue: #075fc9;
      --blue-dark: #034ea9;
      --ink: #050b16;
      --muted: #536173;
      --border: #dfe7f1;
      --soft: #f6f9fc;
      --ice: #e9f5ff;
      --white: #ffffff;
      --shadow: 0 14px 30px rgba(15,23,42,0.08);
      --sidebar-w: 256px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 75%; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--soft);
      color: var(--ink);
      line-height: 1.5;
      display: flex;
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }
    button, input, select, textarea { font: inherit; }

    /* ── Sidebar ── */
    .sidebar {
      width: var(--sidebar-w);
      min-height: 100vh;
      background: var(--white);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 40;
      overflow-y: auto;
    }

    .sidebar-brand {
      padding: 20px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -0.04em;
      color: var(--ink);
    }

    .brand-icon {
      width: 34px; height: 34px;
      display: grid; place-items: center;
      border-radius: 10px;
      background: var(--blue);
      color: var(--white);
      flex-shrink: 0;
    }

    .sidebar-biz {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
    }

    .biz-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .biz-sector {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .sidebar-nav {
      flex: 1;
      padding: 10px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .nav-section-label {
      padding: 10px 8px 4px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 10px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      color: #364354;
      cursor: pointer;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      transition: background 0.15s, color 0.15s;
    }

    .nav-item:hover { background: var(--soft); color: var(--ink); }
    .nav-item.active { background: var(--ice); color: var(--blue); font-weight: 700; }
    .nav-item svg { width: 17px; height: 17px; flex-shrink: 0; }

    .sidebar-footer {
      padding: 12px 10px;
      border-top: 1px solid var(--border);
    }

    /* ── Main ── */
    .main {
      margin-left: var(--sidebar-w);
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      position: sticky;
      top: 0; z-index: 30;
      background: rgba(255,255,255,0.95);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(16px);
      padding: 0 28px;
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .topbar-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .topbar-actions { display: flex; align-items: center; gap: 10px; }

    .btn {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 15px;
      border: 1px solid transparent;
      border-radius: 11px;
      background: transparent;
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s, box-shadow 0.15s;
      white-space: nowrap;
    }

    .btn:hover { transform: translateY(-1px); }

    .btn-primary {
      background: var(--blue);
      color: var(--white);
      box-shadow: 0 6px 18px rgba(7,95,201,0.22);
    }
    .btn-primary:hover { background: var(--blue-dark); }

    .btn-light {
      background: var(--white);
      border-color: var(--border);
    }
    .btn-light:hover { background: var(--soft); }

    .btn-ghost { color: var(--muted); }
    .btn-ghost:hover { color: #c0392b; background: #fef2f2; }

    .btn-sm { min-height: 32px; padding: 0 11px; font-size: 12px; border-radius: 8px; }

    .content { padding: 28px; flex: 1; }

    /* ── Panels ── */
    .panel { display: none; }
    .panel.active { display: block; }

    /* ── Stats ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 22px;
    }

    .stat-label { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
    .stat-value { font-size: 28px; font-weight: 900; letter-spacing: -0.04em; color: var(--ink); }
    .stat-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

    /* ── Section header ── */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .section-title { font-size: 18px; font-weight: 800; letter-spacing: -0.03em; }

    /* ── Listing cards ── */
    .listings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 14px;
    }

    .listing-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .listing-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .listing-name { font-size: 15px; font-weight: 700; line-height: 1.3; }

    .listing-badge {
      font-size: 12px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 99px;
      background: var(--ice);
      color: var(--blue);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .listing-meta {
      font-size: 13px;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .listing-meta span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .listing-actions { display: flex; gap: 8px; margin-top: 4px; }

    /* ── Empty state ── */
    .empty-state {
      text-align: center;
      padding: 56px 20px;
      color: var(--muted);
      background: var(--white);
      border: 1.5px dashed var(--border);
      border-radius: 18px;
      grid-column: 1 / -1;
    }

    .empty-icon {
      width: 52px; height: 52px;
      background: var(--soft);
      border-radius: 16px;
      display: grid; place-items: center;
      margin: 0 auto 16px;
    }

    .empty-state h3 { font-size: 17px; font-weight: 700; color: var(--ink); margin-bottom: 6px; }
    .empty-state p { font-size: 14px; margin-bottom: 20px; }

    /* ── Add form ── */
    .form-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px;
      max-width: 780px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px 18px;
    }

    .form-row { display: grid; gap: 6px; }
    .form-row.full { grid-column: 1 / -1; }

    label { font-size: 13px; font-weight: 700; color: var(--ink); }

    input, select, textarea {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--white);
      color: var(--ink);
      padding: 0 13px;
      outline: none;
      font-size: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea { min-height: 96px; padding: 11px 13px; resize: vertical; }

    input:focus, select:focus, textarea:focus {
      border-color: rgba(7,95,201,0.55);
      box-shadow: 0 0 0 4px rgba(7,95,201,0.1);
    }

    input::placeholder, textarea::placeholder { color: #8b96a2; }

    .chips-group {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 2px;
    }

    .chip-label {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      border: 1px solid var(--border);
      border-radius: 99px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      user-select: none;
      color: #364354;
    }

    .chip-label input[type="checkbox"] { display: none; }

    .chip-label.checked {
      background: var(--ice);
      border-color: var(--blue);
      color: var(--blue);
    }

    .form-actions { display: flex; gap: 10px; margin-top: 22px; }

    /* ── Profile ── */
    .profile-section { margin-bottom: 28px; }
    .profile-section h3 { font-size: 15px; font-weight: 800; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }

    .profile-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px 18px;
      max-width: 700px;
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 22px; right: 22px;
      background: var(--ink);
      color: var(--white);
      padding: 13px 18px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      z-index: 999;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.25s, transform 0.25s;
      pointer-events: none;
    }

    .toast.show { opacity: 1; transform: translateY(0); }

    /* ── Responsive ── */
    @media (max-width: 860px) {
      .sidebar { display: none; }
      .main { margin-left: 0; }
      .form-grid, .profile-grid { grid-template-columns: 1fr; }
      .form-row.full { grid-column: auto; }
    }

    @media (max-width: 520px) {
      .content { padding: 18px; }
      .topbar { padding: 0 18px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

<!-- ── Sidebar ── -->
<aside class="sidebar">

    Marketly

      Log out

  </div>
</aside>

<!-- ── Main ── -->
<div class="main">
  <div class="topbar">
    <span class="topbar-title" id="topbar-title">Dashboard</span>
    <div class="topbar-actions">
      <button class="btn btn-primary" onclick="showPanel('add')">
        <svg viewBox="0 0 24 24" fill="none" width="15" height="15"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        <span id="add-btn-label">Add listing</span>
      </button>
    </div>
  </div>

  <div class="content">

    <!-- Overview -->
    <div class="panel active" id="panel-overview">
      <div class="stats-grid" id="stats-grid"></div>
      <div class="section-header">
        <span class="section-title">Recent listings</span>
        <button class="btn btn-light btn-sm" onclick="showPanel('listings')">View all →</button>
      </div>
      <div id="overview-listings"></div>
    </div>

    <!-- Listings -->
    <div class="panel" id="panel-listings">
      <div class="section-header">
        <span class="section-title" id="listings-title">My Listings</span>
        <button class="btn btn-primary btn-sm" onclick="showPanel('add')">+ Add new</button>
      </div>
      <div class="listings-grid" id="listings-grid"></div>
    </div>

    <!-- Add listing -->
    <div class="panel" id="panel-add">
      <div class="section-header">
        <span class="section-title" id="add-title">Add listing</span>
        <button class="btn btn-light btn-sm" onclick="showPanel('listings')">← Back</button>
      </div>
      <div class="form-card">
        <div class="form-grid" id="add-form-fields"></div>
        <div class="form-actions">
          <button class="btn btn-primary" onclick="saveListing()">Save listing</button>
          <button class="btn btn-light" onclick="showPanel('listings')">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Profile -->
    <div class="panel" id="panel-profile">
      <div class="section-header">
        <span class="section-title">Business profile</span>
        <button class="btn btn-primary btn-sm" onclick="saveProfile()">Save changes</button>
      </div>
      <div class="form-card">
        <div class="profile-section">
          <h3>Owner details</h3>
          <div class="profile-grid" id="profile-owner"></div>
        </div>
        <div class="profile-section">
          <h3>Business details</h3>
          <div class="profile-grid" id="profile-biz"></div>
        </div>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

// Nav items that map to the "listings" panel
const LISTINGS_PANEL_NAV = new Set(['calendar','bookings','tables','orders','inventory','appointments','staff','enquiries','portfolio','proposals','skills','tours','tickets','attendees','students','schedule','leads','integrations']);

// ─── State ────────────────────────────────────────────────────────────────────
let business = {};
let listings = [];
let cfg = {};

function init() {
  business = JSON.parse(localStorage.getItem('marketly_business') || '{}');
  listings  = JSON.parse(localStorage.getItem('marketly_listings')  || '[]');

  // Ensure old registrations (before id was added) get an id
  if (!business.id) {
    business.id = Date.now().toString();
    localStorage.setItem('marketly_business', JSON.stringify(business));
  }

  const sector = business.sector || 'other';
  cfg = SECTORS[sector] || SECTORS.other;

  document.getElementById('sidebar-biz-name').textContent  = business.company_name || 'Your Business';
  document.getElementById('sidebar-biz-sector').textContent = cfg.label;
  document.getElementById('listings-title').textContent    = 'My ' + cfg.noun + 's';
  document.getElementById('add-title').textContent         = 'Add ' + cfg.noun;
  document.getElementById('add-btn-label').textContent     = 'Add ' + cfg.noun.toLowerCase();

  buildNav();
  buildStats();
  buildAddForm();
  buildProfile();
  renderListings();
  renderOverview();
}

function buildNav() {
  const nav = document.getElementById('sidebar-nav');
  nav.innerHTML = cfg.nav.map(key => {
    const item = NAV_ITEMS[key];
    return `<button class="nav-item ${key === 'overview' ? 'active' : ''}" data-nav="${key}" onclick="showPanel('${key}')">
      <svg viewBox="0 0 24 24" fill="none">${item.icon}</svg>
      ${item.label}
    </button>`;
  }).join('');
}

function buildStats() {
  const grid = document.getElementById('stats-grid');
  grid.innerHTML = cfg.stats.map(([label, src]) => {
    const val = src === 'listings' ? listings.length : src;
    return `<div class="stat-card">
      <div class="stat-label">${label}</div>
      <div class="stat-value">${val}</div>
      <div class="stat-sub">Updated just now</div>
    </div>`;
  }).join('');
}

function buildAddForm() {
  const container = document.getElementById('add-form-fields');
  container.innerHTML = cfg.fields.map(f => {
    let input = '';
    if (f.type === 'select') {
      input = `<select id="f-${f.id}">
        <option value="">Choose…</option>
        ${f.opts.map(o => `<option>${o}</option>`).join('')}
      </select>`;
    } else if (f.type === 'textarea') {
      input = `<textarea id="f-${f.id}" placeholder="${f.ph || ''}"></textarea>`;
    } else if (f.type === 'chips') {
      input = `<div class="chips-group" id="chips-${f.id}">
        ${f.opts.map(o => `<label class="chip-label">
          <input type="checkbox" value="${o}" onchange="toggleChip(this)"> ${o}
        </label>`).join('')}
      </div>`;
    } else {
      input = `<input id="f-${f.id}" type="${f.type}" placeholder="${f.ph || ''}">`;
    }
    const labelEl = f.type !== 'chips'
      ? `<label for="f-${f.id}">${f.label}</label>`
      : `<label>${f.label}</label>`;
    return `<div class="form-row${f.full ? ' full' : ''}">${labelEl}${input}</div>`;
  }).join('');
}

function toggleChip(el) {
  el.parentElement.classList.toggle('checked', el.checked);
}

function buildProfile() {
  const ownerFields = [
    { id:'first_name', label:'First name', type:'text' },
    { id:'last_name',  label:'Last name',  type:'text' },
    { id:'email',      label:'Email address', type:'email' },
  ];
  const bizFields = [
    { id:'company_name',    label:'Company name',     type:'text' },
    { id:'location',        label:'Location',          type:'text' },
    { id:'website',         label:'Website',           type:'url'  },
    { id:'mode_service',    label:'Mode of service',   type:'text' },
    { id:'payment_method',  label:'Payment method',    type:'text' },
    { id:'upi_id',          label:'UPI ID',            type:'text' },
    { id:'account_number',  label:'Account number',    type:'text' },
    { id:'ifsc_code',       label:'IFSC code',         type:'text' },
  ];

  document.getElementById('profile-owner').innerHTML = ownerFields.map(f =>
    `<div class="form-row">
      <label for="p-${f.id}">${f.label}</label>
      <input id="p-${f.id}" type="${f.type}" value="${escHtml(business[f.id] || '')}">
    </div>`
  ).join('');

  document.getElementById('profile-biz').innerHTML = bizFields.map(f =>
    `<div class="form-row">
      <label for="p-${f.id}">${f.label}</label>
      <input id="p-${f.id}" type="${f.type}" value="${escHtml(business[f.id] || '')}">
    </div>`
  ).join('');
}

function saveProfile() {
  const ids = ['first_name','last_name','email','company_name','location','website','mode_service','payment_method','upi_id','account_number','ifsc_code'];
  ids.forEach(id => {
    const el = document.getElementById('p-' + id);
    if (el) business[id] = el.value;
  });
  localStorage.setItem('marketly_business', JSON.stringify(business));
  document.getElementById('sidebar-biz-name').textContent = business.company_name || 'Your Business';
  showToast('Profile saved!');
}

function saveListing() {
  const listing = { id: Date.now() };

  cfg.fields.forEach(f => {
    if (f.type === 'chips') {
      const group = document.getElementById('chips-' + f.id);
      listing[f.id] = group
        ? Array.from(group.querySelectorAll('input:checked')).map(c => c.value).join(', ')
        : '';
    } else {
      const el = document.getElementById('f-' + f.id);
      listing[f.id] = el ? el.value : '';
    }
  });

  // Derive display name and price for card rendering
  const firstTextField = cfg.fields.find(f => ['text','select'].includes(f.type));
  listing._name = firstTextField ? (listing[firstTextField.id] || 'Untitled') : 'Untitled';

  const priceField = cfg.fields.find(f => ['price','price_per_night','ticket_price'].includes(f.id));
  listing._price = priceField ? listing[priceField.id] : '';

  // Pick 2–3 meaningful meta values for the card
  const metaFields = cfg.fields.filter(f => !['textarea','chips'].includes(f.type) && f.id !== firstTextField?.id && f.id !== priceField?.id).slice(0, 3);
  listing._meta = metaFields.map(f => listing[f.id]).filter(Boolean);

  listings.push(listing);
  localStorage.setItem('marketly_listings', JSON.stringify(listings));

  // Sync to public store so marketplace pages can read it
  listing.business_id   = business.id;
  listing.business_name = business.company_name;
  const pubListings = JSON.parse(localStorage.getItem('marketly_all_listings') || '[]');
  pubListings.push(listing);
  localStorage.setItem('marketly_all_listings', JSON.stringify(pubListings));

  buildStats();
  renderListings();
  renderOverview();
  showPanel('listings');
  buildAddForm(); // reset form
  showToast(cfg.noun + ' added!');
}

function deleteListing(id) {
  listings = listings.filter(l => l.id !== id);
  localStorage.setItem('marketly_listings', JSON.stringify(listings));

  // Remove from public store too
  const pubListings = JSON.parse(localStorage.getItem('marketly_all_listings') || '[]');
  localStorage.setItem('marketly_all_listings', JSON.stringify(pubListings.filter(l => l.id !== id)));
  buildStats();
  renderListings();
  renderOverview();
  showToast('Listing removed');
}

function renderListings() {
  const grid = document.getElementById('listings-grid');
  if (!listings.length) {
    grid.innerHTML = `<div class="empty-state">
      <div class="empty-icon">
        <svg viewBox="0 0 24 24" fill="none" width="24" height="24"><path d="M12 5v14M5 12h14" stroke="var(--muted)" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
      <h3>No ${cfg.noun.toLowerCase()}s yet</h3>
      <p>Add your first ${cfg.noun.toLowerCase()} to get discovered on Marketly.</p>
      <button class="btn btn-primary" onclick="showPanel('add')">+ Add ${cfg.noun.toLowerCase()}</button>
    </div>`;
    return;
  }
  grid.innerHTML = listings.map(l => cardHTML(l)).join('');
}

function renderOverview() {
  const el = document.getElementById('overview-listings');
  if (!listings.length) {
    el.innerHTML = `<div class="empty-state">
      <div class="empty-icon">
        <svg viewBox="0 0 24 24" fill="none" width="24" height="24"><path d="M12 5v14M5 12h14" stroke="var(--muted)" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
      <h3>No ${cfg.noun.toLowerCase()}s yet</h3>
      <p>Start by adding your first ${cfg.noun.toLowerCase()}.</p>
      <button class="btn btn-primary" onclick="showPanel('add')">+ Add ${cfg.noun.toLowerCase()}</button>
    </div>`;
    return;
  }
  const recent = [...listings].reverse().slice(0, 4);
  el.innerHTML = `<div class="listings-grid">${recent.map(l => cardHTML(l, false)).join('')}</div>`;
}

function cardHTML(l, showActions = true) {
  const price = l._price ? `₹${Number(l._price).toLocaleString('en-IN')}` : '';
  const meta  = (l._meta || []).map(v => `<span>${escHtml(v)}</span>`).join('');
  const actions = showActions ? `<div class="listing-actions">
    <button class="btn btn-light btn-sm" onclick="editListing(${l.id})">Edit</button>
    <button class="btn btn-ghost btn-sm" onclick="deleteListing(${l.id})">Remove</button>
  </div>` : '';
  return `<div class="listing-card">
    <div class="listing-card-top">
      <span class="listing-name">${escHtml(l._name)}</span>
      ${price ? `<span class="listing-badge">${price}</span>` : ''}
    </div>
    ${meta ? `<div class="listing-meta">${meta}</div>` : ''}
    ${actions}
  </div>`;
}

function editListing(id) {
  // Prefill form with existing data and switch to add panel
  const l = listings.find(x => x.id === id);
  if (!l) return;
  showPanel('add');
  cfg.fields.forEach(f => {
    if (f.type === 'chips') {
      const group = document.getElementById('chips-' + f.id);
      if (!group) return;
      const vals = (l[f.id] || '').split(', ');
      group.querySelectorAll('input').forEach(cb => {
        cb.checked = vals.includes(cb.value);
        cb.parentElement.classList.toggle('checked', cb.checked);
      });
    } else {
      const el = document.getElementById('f-' + f.id);
      if (el) el.value = l[f.id] || '';
    }
  });
  // Remove old entry and save on next submit
  listings = listings.filter(x => x.id !== id);
  localStorage.setItem('marketly_listings', JSON.stringify(listings));
  buildStats();
}

function showPanel(name) {
  const isPanelName = ['overview','listings','add','profile'].includes(name);
  const target = isPanelName ? name : LISTINGS_PANEL_NAV.has(name) ? 'listings' : 'overview';

  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + target).classList.add('active');

  document.querySelectorAll('[data-nav]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.nav === name);
  });

  const titleMap = {
    overview: 'Dashboard',
    listings: 'My ' + cfg.noun + 's',
    add:      'Add ' + cfg.noun,
    profile:  'Business profile',
  };
  document.getElementById('topbar-title').textContent = titleMap[target] || (NAV_ITEMS[name]?.label || 'Dashboard');
}

function logout() {
  localStorage.removeItem('marketly_logged_in');
  window.location.href = 'owner-login.html';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

init();
</script>
</body>
</html>
