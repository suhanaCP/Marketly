<div class="dashboard-top"><div><p class="eyebrow">Messages</p><h1>Messages for <span data-company></span></h1></div></div>

<div class="inbox-layout">
  <div class="inbox-list" id="inboxList"></div>
  <div class="inbox-thread">
    <div class="thread-header hidden" id="threadHeader">
      <span class="message-avatar" data-thread-avatar></span>
      <div><strong data-thread-name></strong><span data-thread-sub>Customer</span></div>
    </div>
    <div class="thread-messages hidden" id="threadMessages"></div>
    <div class="inbox-empty" id="inboxEmpty">Select a conversation to view messages.</div>
    <form class="thread-input-row hidden" id="threadInputForm">
      <input type="text" name="reply" placeholder="Type a message..." autocomplete="off">
      <button class="btn btn-primary" type="submit">Send</button>
    </form>
  </div>
</div>
